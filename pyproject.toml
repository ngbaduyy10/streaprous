[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "streamlink"
version = "1.0.0"
description = "Distributed streaming-based client-server collaboration app over a custom reliable UDP protocol"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["streamlink*"]

[tool.setuptools.package-data]
"streamlink.client.web" = ["static/*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP007", "UP045"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
